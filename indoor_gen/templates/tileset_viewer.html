<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TILESET__ viewer</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.45 -apple-system, "Hiragino Sans", sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; width: 280px; background: rgba(255,255,255,.95); border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
  h1 { font-size: 14px; margin: 0 0 6px; } select { width: 100%; padding: 4px; margin: 6px 0; }
  pre { margin: 6px 0 0; font-size: 11px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  .err { color: #c22; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>mapbox://__TILESET_ID__</h1>
  <select id="structure"></select>
  <div id="state">–</div>
  <pre id="log"></pre>
</div>
<script>
const TILESET_ID = __TILESET_ID_JSON__;
const STRUCTURES = __STRUCTURES__;   // [{id, name, lon, lat}]
const STYLE_SNIPPET = __SNIPPET__;   // publish.style_snippet(): source, indoor block, layers
let token = __TOKEN__;
try { token = token || localStorage.getItem('mapbox-token'); } catch {}
if (!token) {
  token = prompt('Mapbox public token (pk.…)');
  try { localStorage.setItem('mapbox-token', token || ''); } catch {}
}
mapboxgl.accessToken = token;

const log = (m, bad) => { const el = document.getElementById('log'); el.innerHTML += `<div class="${bad ? 'err' : ''}">${m}</div>`; };
const sel = document.getElementById('structure');
STRUCTURES.forEach((s, i) => sel.add(new Option(s.name, i)));

const first = STRUCTURES[0] || { lon: 139.76, lat: 35.68 };
const map = new mapboxgl.Map({
  container: 'map', center: [first.lon, first.lat], zoom: 17, pitch: 50, bearing: -15, antialias: true,
  style: {
    version: 8,
    imports: [{ id: 'basemap', url: 'mapbox://styles/mapbox/standard', config: { showIndoor: false } }],
    sources: { indoor: { type: 'vector', url: `mapbox://${TILESET_ID}` } },
    indoor: STYLE_SNIPPET.indoor,
    layers: STYLE_SNIPPET.layers,
  },
});
// The style has no images of its own: draw the poi-<icon> badges (elevator, stairs, toilets, ...) on a canvas.
function addPoiImages() {
  const size = 56;
  for (const [icon, [text, color]] of Object.entries(STYLE_SNIPPET.poi_badges || {})) {
    const name = 'poi-' + icon;
    if (map.hasImage(name)) continue;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = color;
    g.beginPath(); g.arc(size / 2, size / 2, size / 2 - 3, 0, Math.PI * 2); g.fill();
    g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `bold ${text.length > 2 ? 18 : 24}px sans-serif`;
    g.fillText(text, size / 2, size / 2 + 1);
    map.addImage(name, g.getImageData(0, 0, size, size), { pixelRatio: 2 });
  }
}
map.on('style.load', addPoiImages);
map.addControl(new mapboxgl.NavigationControl(), 'top-right');
map.addControl(new mapboxgl.IndoorControl(), 'bottom-right');
map.on('error', (e) => log(`error: ${e.error && e.error.message}`, true));
sel.onchange = () => { const s = STRUCTURES[sel.value]; map.flyTo({ center: [s.lon, s.lat], zoom: 17.5, duration: 1500 }); };

// What the renderer knows (experimental manager state, only for this check) and what is actually drawn.
function report() {
  const mgr = map.style && map.style.indoorManager;
  const st = mgr && mgr.getControlState();
  const drawn = map.queryRenderedFeatures({ layers: ['indoor-room-fills'] });
  document.getElementById('state').innerHTML = [
    `zoom ${map.getZoom().toFixed(1)}（屋内は 16 以上）`,
    st ? `階: ${st.floors.map(f => f.name).join(' ')} / 選択 ${st.selectedFloorId || '–'}` : 'indoor manager なし',
    `描画中の部屋 ${drawn.length}`,
  ].join('<br>');
}
map.on('idle', report);

// IndoorControl's top button hides the floors (zooming out does too): let the basemap's building show again then,
// instead of leaving the clip layer's hole empty. Same thing the preview does.
function followClip(tries = 0) {
  const mgr = map.style && map.style.indoorManager;
  if (!mgr) { if (tries < 40) setTimeout(() => followClip(tries + 1), 250); return; }
  const apply = (st) => map.getLayer('building-clip') &&
    map.setFilter('building-clip', st && st.activeFloorsVisible ? ['==', ['get', 'type'], 'facility'] : false);
  mgr.on('selector-update', apply);
  apply(mgr.getControlState());
}
map.on('load', () => followClip());
</script>
</body>
</html>
